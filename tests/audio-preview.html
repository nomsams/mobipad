<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobipad audio integration checks</title><style>body{background:#111313;color:#caee91;font:16px system-ui;margin:30px}button{background:#caee91;color:#192411;padding:12px 20px;border:0;border-radius:8px;font:inherit}pre{white-space:pre-wrap;line-height:1.8;color:#d4ded0}</style></head><body><h1>Audio integration checks</h1><p>Uses a generated signal. Does not request microphone access.</p><button id="run">Run browser audio checks</button><pre id="results" role="status">Ready.</pre><script type="module">
import {AudioEngine} from '../js/engine.js';
import {defaultSession,drums} from '../js/presets.js';
const button=document.querySelector('#run'),out=document.querySelector('#results');
button.onclick=async()=>{button.disabled=true;out.textContent='Running…\n';let engine;
const report=s=>out.textContent+=s+'\n';
try{
 const rate=44100,context=new OfflineAudioContext(1,rate*4,rate),e=new AudioEngine(defaultSession());e.ctx=context;e.master=context.createGain();e.master.gain.value=.7;e.master.connect(context.destination);e.noise=context.createBuffer(1,rate,rate);const n=e.noise.getChannelData(0);for(let i=0;i<n.length;i++)n[i]=Math.random()*2-1;
 const voices=['piano','bass','guitar','synth','bell',...drums];voices.forEach((voice,i)=>e.play({voice,note:60,duration:.18,velocity:.7},i*.25));
 const rendered=await context.startRendering(),data=rendered.getChannelData(0);for(let i=0;i<voices.length;i++){const values=data.subarray(Math.floor(i*.25*rate),Math.floor((i*.25+.2)*rate));const energy=values.reduce((s,v)=>s+v*v,0)/values.length;if(!(energy>.000001)||!values.every(Number.isFinite))throw new Error(voices[i]+' did not produce valid audio');}report('PASS · All 13 synthesized voices rendered finite, non-silent audio.');
 engine=new AudioEngine(defaultSession());await engine.init();await engine.ctx.audioWorklet.addModule('../js/capture-worklet.js');
 engine.openMic=async()=>{const ctx=engine.ctx,source=ctx.createOscillator(),node=new AudioWorkletNode(ctx,'mobipad-capture');source.frequency.value=440;source.connect(node);node.connect(ctx.destination);source.start(ctx.currentTime+.04);source.stop(ctx.currentTime+.34);return {node,close(){node.disconnect();source.disconnect();}};};
 const start=engine.ctx.currentTime,recording=await engine.beginMic(start,start+.4);await new Promise(r=>setTimeout(r,500));await recording.stop();const b=engine.micBuffer(recording,start,start+.4),values=b.getChannelData(0);if(b.length!==Math.round(engine.ctx.sampleRate*.4))throw new Error('Capture length mismatch');if(!values.some(v=>Math.abs(v)>.2))throw new Error('Worklet captured silence');report('PASS · AudioWorklet captured a generated signal and trimmed an exact 400 ms take.');
 const wav=engine.bufferWav(b),decoded=await engine.ctx.decodeAudioData(wav);if(Math.abs(decoded.duration-.4)>.001)throw new Error('WAV roundtrip duration mismatch');report('PASS · Recorded WAV encoded and decoded with the expected duration.');
 engine.buffers.set('test',decoded);engine.session.pads[12]={...engine.session.pads[12],kind:'audio',audioId:'test',bars:1};engine.master.gain.value=0;engine.launchAudio(12,engine.ctx.currentTime+.03,0);report('PASS · Imported AudioBuffer scheduled with tempo-fit playback rate.');
 report('ALL BROWSER AUDIO CHECKS PASSED');
}catch(error){report('FAIL · '+error.message);console.error(error);}finally{await engine?.ctx?.close();button.disabled=false;}
};
</script></body></html>
